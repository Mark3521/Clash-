# Custom_OpenClash_Rules
# OpenClash 专用最小 YAML 配置文件（标准版）
# 项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
# 本文件仅定义节点来源、静态节点、策略组、规则提供者与分流规则。
# 端口、运行模式、DNS、IPv6、TUN、嗅探、GeoData、日志及控制器等参数全部由 OpenClash LuCI 管理。
# 建议先按照项目 Wiki 完成 OpenClash 设置，再加载本配置。

# ==================== 静态代理节点 Proxies ====================
proxies:
  - name: "🏴‍☠️ 自建节点"
    type: trojan
    server: us-2.hydraing.com
    port: 443
    password: "dXmnym9xNvMAYsK5va"
    udp: true
    sni: us-2.hydraing.com
    skip-cert-verify: false
    client-fingerprint: chrome

# ==================== 代理提供者 Proxy Providers ====================
proxy-providers:
  provider1:
    type: http
    url: "https://s2.trojanflare.one/clashx/40866a9c-4281-4800-96a6-685bbacf383c"  # 填入订阅链接
    interval: 86400  # 订阅更新间隔，单位：秒（86400秒 = 24小时）
    path: ./proxy_provider/provider1.yaml
    proxy: "🏴‍☠️ 自建节点"  # 使用自建节点更新订阅（若自建节点不通可改为 DIRECT）
    # 全局屏蔽词仅保留“有效期”
    filter: "(?i)^(?!.*(有效期)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true

# ==================== 代理策略组 Proxy Groups ====================
proxy-groups:
  # --- 核心与业务策略组 ---
  - name: "🚀 手动选择"
    type: select
    proxies:
      - "🏴‍☠️ 自建节点"
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇼🇸 台湾节点"
      - "🇳🇱 荷兰节点"
      - "🇦🇺 澳大利亚节点"
      - "🇪🇪 爱沙尼亚节点"
